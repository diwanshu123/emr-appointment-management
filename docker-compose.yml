services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/emr_appointments
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      CLIENT_ORIGIN: http://localhost:8080
      TRUST_PROXY: 1

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"

volumes:
  mongo-data:
